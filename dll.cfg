MEMORY {
  DLL_ADDR: start = $7000, size = $1000, file = %O;
}

SEGMENTS {
  DLL_API:    load = DLL_ADDR, type = ro; # jump table first
  RODATA: load = DLL_ADDR, type = ro; # read-only data
  DATA:   load = DLL_ADDR, type = ro; # read-write data
  CODE:   load = DLL_ADDR, type = ro; # code follows
}

